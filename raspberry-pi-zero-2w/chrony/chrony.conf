# Chrony configuration for Urban Acoustics Pi sensors.
#
# Goal: keep the device clock accurate enough that the LAeq timestamps on
# the cloud side line up with each other to within ~50 ms across a fleet.
# The Pi Zero 2 W has no RTC, so a quick sync at boot is essential before
# the firmware starts publishing events.
#
# Install path:  /etc/chrony/chrony.conf
# Reload:        sudo systemctl restart chrony

# Pool: NTP Pool Project regional pool. iburst speeds up first contact.
pool 2.debian.pool.ntp.org iburst

# Allow chronyd to step the clock if it is more than 1 s off — without this
# the firmware can publish telemetry with a wildly wrong timestamp until
# chrony slews back into range.
makestep 1.0 3

# Write the system clock back to the RTC if one becomes available later
# (e.g. an HW RTC HAT). Harmless on a Pi Zero with no RTC.
rtcsync

# Modest serve config: refuse all client requests; this device is a client
# only. Devices on the same LAN can run their own chrony if needed.
deny all

# Drift file (chronyd estimates the local oscillator drift and writes it
# here so subsequent boots converge faster).
driftfile /var/lib/chrony/chrony.drift

# Logging — keep small to spare the SD card.
logdir /var/log/chrony
log measurements statistics tracking

# Don't let chronyd run with no sources; systemd should retry until WiFi
# is up.
minsources 1
