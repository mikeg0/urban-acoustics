[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urban-acoustics-firmware"
version = "0.1.0"
description = "Pi Zero 2 W noise sensor firmware for the Urban Acoustics project"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Urban Acoustics" }]
dependencies = [
    "numpy>=1.26,<3.0",
    "paho-mqtt>=2.0,<3.0",
    "httpx>=0.27,<1.0",
]

[project.scripts]
urban-acoustics = "urban_acoustics.__main__:main"

[tool.setuptools.packages.find]
include = ["urban_acoustics*"]
