[alembic]
script_location = app/migrations
# DATABASE_URL is read at runtime from env via app.settings — don't hardcode here.
sqlalchemy.url =
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
timezone = UTC
version_locations = %(here)s/app/migrations/versions

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
