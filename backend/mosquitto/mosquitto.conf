# Phase 1 broker config. Devices connect over mTLS; the broker terminates TLS,
# validates the client cert against the pinned CA, and uses the cert CN as the
# MQTT username so the ACL file can scope each device to its own subtree.

allow_anonymous false

# --- mTLS listener ----------------------------------------------------------
listener 8883 0.0.0.0
protocol mqtt

cafile   /mosquitto/config/certs/root-ca.crt
certfile /mosquitto/config/certs/mosquitto.crt
keyfile  /mosquitto/config/certs/mosquitto.key

require_certificate      true
use_identity_as_username true
tls_version              tlsv1.2

# --- ACL --------------------------------------------------------------------
acl_file /mosquitto/config/aclfile

# --- Persistence ------------------------------------------------------------
# QoS 1 inflight + retained messages survive restart.
persistence true
persistence_location /mosquitto/data/
autosave_interval    60

# --- Logging ----------------------------------------------------------------
log_dest    stdout
log_type    error
log_type    warning
log_type    notice
log_timestamp true
